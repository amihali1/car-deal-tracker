# Web dashboard + optional private remote access over Tailscale. Started by scripts/deploy.sh.
# The cron scan runs on the host; both share data/tracker.db through the bind mount.
services:
  web:
    image: python:3.12-slim
    container_name: car-tracker-web
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # same owner as the cron job, so the DB stays writable
    working_dir: /app
    command: python -m tracker serve
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/app
    ports:
      - "8095:8095"   # LAN: http://<server>:8095
    restart: unless-stopped

  # Optional. Joins your tailnet as "cars" (userspace networking, no sudo needed on the host) and serves
  # the dashboard at https://cars.<tailnet>.ts.net. Signs in with TS_AUTHKEY from .env (one-off key);
  # interactive login doesn't work here because containerboot gives up after ~60s, restarts, and makes
  # a new node + login URL each time. After the first sign-in, identity persists in data/tailscale and
  # the key is never used again (TS_AUTH_ONCE).
  tailscale:
    image: tailscale/tailscale:stable
    container_name: car-tracker-ts
    hostname: cars
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./deploy/ts-serve.json:/config/serve.json:ro
    depends_on:
      - web
    restart: unless-stopped
